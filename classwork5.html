<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Return Page</title>
    <style>
    body{
        text-align: center;
    }
</style>
</head>
<body>
    <h1>Item Return Eligibility</h1>
    <button onclick="checkReturn()">Check Return</button>
    <p id="result"></p>
    <script>
        var order = {
    itemName: "Wireless Headphones",
    isDelivered: true,
    daysSinceDelivery: 5
};

function checkReturn() {
    var result = (order.isDelivered && order.daysSinceDelivery <= 7)
        ? "Eligible for Return"
        : "Return Period Expired";

    document.getElementById("result").textContent = result;

    console.log("itemName" in order);

    delete order.daysSinceDelivery;
}
    </script>
</body>
</html>
