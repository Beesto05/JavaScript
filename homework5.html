<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            text-align: center;
            background-color:grey
        }
    </style>
</head>
<body>
      <h1>User Profile</h1>

    <button onclick="checkAccess()">Check Access</button>

    <p id="result"></p>

    <script>
        var user = {
            name: "Arun",
            age: 20,
            isAdmin: true
        };

        function checkAccess() {

            var result = (user.age >= 18 && user.isAdmin)
                ? "Access Granted"
                : "Access Denied";

            document.getElementById("result").textContent = result;

            console.log("age" in user);

            delete user.age;
        }
    </script>
</body>
</html>
